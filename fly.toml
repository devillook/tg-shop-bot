# fly.toml app configuration file generated for tg-shop-bot-z3dhxw on 2026-10-29T09:50:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tg-shop-bot-z3dhxw'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'

[processes]
  app = 'python main.py'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
